<style>
#cgb.cgbContainer{
  display: flex;
  align-items: center;
  width: 100%;
}

#cgb .cgbContainer a {
  color: #000000;
}

#cgb .xyCTA{
  text-decoration: underline;
  text-underline-position: under;
  text-decoration-thickness: 1px;
  font-weight: 500;
  font-size: 20px;
}
#cgb .xyHeader1{
  font-size: 45px;
  line-height: 1.25;
  margin: 0 0 12px 0;
}
#cgb .xyHeader3{
  font-size: 20px;
  margin: 0 0 18px 0;
}

#cgb .textContainer1 {
  padding-left: min(24px, 2vw);
  min-width: 37%;
  flex: 0 1 37%;
}

@media screen and (max-width: 1200px){
  #cgb .xyHeader1{
    font-size: 32px;
  }
  #cgb .xyHeader3{
    font-size: 18px;
  }
  #cgb .xyCTA{
    font-size: 18px;
  }
}
@media screen and (max-width: 800px){
  #cgb .xyHeader1{
    font-size: 30px;
  }
  #cgb .xyHeader3{
    font-size: 14px;
  }
  #cgb .xyCTA{
    font-size: 14px;
  }
}
@media screen and (max-width: 650px){
  #cgb .xyHeader1{
    font-size: 20px;
  }
}</style>
<div id="cgb" class="cgbContainer" style="background-color:#f6e7e6">
<div class="textContainer1">
  <p class="xyHeader1">
    Bis zu 50% Rabatt
    </br>
    auf alle Textilien
  </p>
  <p class="xyHeader3">Nur bis zum 9. Februar 2025</p>
  <a class="xyCTA" href="/textilien">
    Jetzt shoppen
  </a>
</div>
  <a href="/textilien"><video style="max-width: 100%; vertical-align: middle;" autoplay="" loop="" muted="" playsinline="" disableremoteplayback="true" >
    <source src="{imageurl src="banner" picid=$banner->id ext=$banner->ext}" type="video/mp4">
    </video>
  </a>
</div>
